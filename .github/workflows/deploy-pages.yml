# public/ フォルダの中身を GitHub Pages に公開するワークフロー。
# main ブランチに push されるたびに自動で実行される。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開処理が重ならないようにする（進行中のデプロイは中断せず待つ）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pagesの設定（未設定なら有効化する）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: public/ を公開ファイルとしてアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: 公開する
        id: deployment
        uses: actions/deploy-pages@v4
